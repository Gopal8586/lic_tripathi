<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>503 - Service Unavailable</title>
  <style>
    body {
      margin: 0; padding: 0; background: #2980b9; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center;
    }
    .code { font-size: 10rem; font-weight: bold; margin: 0; line-height: 1; }
    .msg { font-size: 2.5rem; margin-top: 10px; font-weight: bold; }
    .desc { font-size: 1.2rem; margin-top: 10px; margin-bottom: 20px; opacity: 0.9; max-width: 500px; }
    .time-estimate { font-size: 1.1rem; background: rgba(0,0,0,0.2); padding: 10px 20px; border-radius: 5px; margin-bottom: 30px; }
    .actions { display: flex; gap: 15px; justify-content: center; }
    .btn {
      padding: 12px 24px; background: rgba(255,255,255,0.15); color: #fff;
      text-decoration: none; border-radius: 5px; border: 2px solid rgba(255,255,255,0.4); font-weight: 600; transition: 0.3s;
    }
    .btn:hover { background: rgba(255,255,255,0.3); }
    .icon { font-size: 5rem; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="icon">🛠️</div>
  <h1 class="code">503</h1>
  <div class="msg">We'll be back soon</div>
  <div class="desc">The website is currently undergoing scheduled maintenance or is overloaded.</div>
  <div class="time-estimate">Estimated time: ~ 30 minutes</div>
  <div class="actions">
    <a href="contact.html" class="btn">Contact Support</a>
    <a href="https://facebook.com" class="btn" target="_blank">Follow on Social</a>
  </div>
</body>
</html>
