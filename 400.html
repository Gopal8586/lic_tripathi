<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>400 - Bad Request</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #8e44ad, #9b59b6);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {
      background: #fff;
      padding: 60px 80px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      text-align: center;
      position: relative;
    }
    .code {
      font-size: 8rem;
      font-weight: 900;
      margin: 0;
      line-height: 1;
      color: #9b59b6;
      text-shadow: 4px 4px 0 #d2b4de, 8px 8px 0 #ebdef0;
    }
    .msg {
      font-size: 1.5rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 20px;
      letter-spacing: 2px;
      color: #8e44ad;
    }
    .sub {
      font-size: 1.5rem;
      color: #333;
      margin-top: 5px;
      font-weight: 600;
    }
    .back-btn {
      display: inline-block;
      margin-top: 40px;
      padding: 12px 24px;
      background: #8e44ad;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      transition: 0.3s;
      font-weight: bold;
    }
    .back-btn:hover {
      background: #732d91;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="code">400</h1>
    <div class="msg">BAD REQUEST</div>
    <div class="sub">400 Bad Request means the server cannot understand the request sent by the browser.</div>
    <div class="sub" style="margin-top: 15px; font-style: italic;">👉 Simple words: User ne galat request bhej di, isliye server usko process nahi kar pa raha.</div>
    <a href="index.html" class="back-btn">Return Home</a>
  </div>
</body>
</html>
