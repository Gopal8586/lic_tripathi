<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>401 - Authorization Required</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f5a623;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .code {
      font-size: 10rem;
      font-weight: bold;
      margin: 0;
      line-height: 1;
    }
    .msg {
      font-size: 2rem;
      margin-top: 10px;
      margin-bottom: 40px;
      font-weight: 500;
    }
    .back-btn {
      padding: 12px 24px;
      background: rgba(0,0,0,0.15);
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      transition: 0.3s;
      border: 2px solid rgba(255,255,255,0.5);
      font-weight: 600;
    }
    .back-btn:hover {
      background: rgba(0,0,0,0.3);
    }
    .icon {
      font-size: 6rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="icon">⛔</div>
  <h1 class="code">401</h1>
  <div class="msg">Please login to continue</div>
  <a href="admin.html" class="back-btn">Login to Continue</a>
</body>
</html>
