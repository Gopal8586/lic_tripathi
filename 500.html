<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - Internal Server Error</title>
  <style>
    body {
      margin: 0; padding: 0; background: #2c3e50; color: #ecf0f1;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center;
    }
    .code { font-size: 10rem; font-weight: bold; margin: 0; line-height: 1; text-shadow: 4px 4px 0 rgba(0,0,0,0.2); }
    .msg { font-size: 2.5rem; margin-top: 10px; font-weight: bold; }
    .desc { font-size: 1.2rem; margin-top: 10px; margin-bottom: 40px; opacity: 0.8; max-width: 500px; }
    .actions { display: flex; gap: 15px; justify-content: center; }
    .btn {
      padding: 12px 24px; background: rgba(255,255,255,0.1); color: #fff;
      text-decoration: none; border-radius: 5px; border: 2px solid rgba(255,255,255,0.3); font-weight: 600; transition: 0.3s;
    }
    .btn:hover { background: rgba(255,255,255,0.2); }
    .btn-primary { background: #e74c3c; border-color: #e74c3c; }
    .btn-primary:hover { background: #c0392b; border-color: #c0392b; }
    .icon { font-size: 5rem; margin-bottom: 10px; animation: spin 4s linear infinite; display: inline-block; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="icon">⚙️</div>
  <h1 class="code">500</h1>
  <div class="msg">Something went wrong</div>
  <div class="desc">Our servers encountered an unexpected condition that prevented it from fulfilling the request.</div>
  <div class="actions">
    <button onclick="window.location.reload()" class="btn btn-primary">Retry Now</button>
    <a href="contact.html" class="btn">Contact Support</a>
  </div>
</body>
</html>
